<main class="auth-shell">
  <section class="signup-panel">
    <header class="topbar">
      <a class="nav-link" routerLink="/">Entrar</a>
    </header>

    <section class="signup-brand">
      <span class="brand-logo-frame">
        <img class="brand-logo" src="/barista-cafe.png" alt="Caf&eacute;" />
      </span>
      <div>
        <p class="eyebrow">Caf&eacute;Finance</p>
        <h1>Criar conta</h1>
      </div>
    </section>

    <form class="signup-card">
      <label>
        E-mail
        <input type="email" placeholder="seuemail@exemplo.com" />
      </label>

      <label>
        Senha
        <input type="password" placeholder="Digite sua senha" />
      </label>

      <a class="primary-action" routerLink="/home">Criar conta</a>
      <a class="secondary-action" routerLink="/">Voltar</a>
    </form>
  </section>
</main>
