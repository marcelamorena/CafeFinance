<main class="auth-shell">
  <section class="signup-panel">
    <header class="topbar">
      <a class="nav-link" routerLink="/">Entrar</a>
    </header>

    <section class="signup-brand">
      <span class="brand-logo-frame">
        <img class="brand-logo" src="/barista-cafe.png" alt="Caf&eacute;" />
      </span>
      <div>
        <p class="eyebrow">Caf&eacute;Finance</p>
        <h1>Criar conta</h1>
      </div>
    </section>

    <form class="signup-card" [formGroup]="cadastroForm" (ngSubmit)="cadastro()">
      <div class="form-group">
        <label for="name">Nome</label>
        <input id="name" type="text" formControlName="name" placeholder="Digite seu nome" />
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" placeholder="seuemail@exemplo.com" />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input id="password" type="password" formControlName="password" placeholder="Digite sua senha" />
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar senha</label>
        <input id="confirmarSenha" type="password" formControlName="confirmarSenha" placeholder="Confirme sua senha" />
      </div>

      @if (mensagem) {
        <p class="mensagem">{{ mensagem }}</p>
      }

      <button class="primary-action" type="submit" [disabled]="carregando">
        {{ carregando ? 'Criando conta...' : 'Criar conta' }}
      </button>
      <a class="secondary-action" routerLink="/">Voltar</a>
    </form>
  </section>
</main>
