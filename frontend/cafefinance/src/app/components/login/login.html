<main class="auth-shell">
  <section class="phone-frame">
    <header class="topbar">
      <span class="breadcrumb"></span>
      <a class="nav-link" routerLink="/home">Entrar</a>
    </header>

    <section class="brand-card">
      <div class="brand-mark">&#9749;</div>
      <div>
        <p class="eyebrow">Caf&eacute;Finance</p>
        <h1>Controle seu bule financeiro</h1>
      </div>
    </section>

    <div  class="login-card">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label>
        E-mail
        <input type="email" formControlName="email" placeholder="seuemail@exemplo.com" />
      </label>

      <label>
        Senha
        <input type="password" formControlName="password" placeholder="Digite sua senha" />
      </label>
      
      <button type="submit">Entrar</button>
      <a class="secondary-action" routerLink="/cadastro">Criar conta</a>
    </form>
  </div>

  

    <section class="barista-tip">
      <span>&#9749;</span>
      <div>
        <strong>Dica do Barista</strong>
        <p>Organize gastos, rateios e metas antes que o caf&eacute; esfrie.</p>
      </div>
    </section>
  </section>
</main>
