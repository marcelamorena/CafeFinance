<main class="auth-shell">
  <section class="phone-frame">
    <header class="topbar">
      <span class="breadcrumb"></span>
      <a class="nav-link" routerLink="/cadastro">Criar conta</a>
    </header>

    <section class="brand-card">
      <span class="brand-logo-frame">
        <img class="brand-logo" src="/barista-cafe.png" alt="Caf&eacute;" />
      </span>
      <div>
        <p class="eyebrow">Caf&eacute;Finance</p>
        <h1>Seu dinheiro no ponto certo</h1>
      </div>
    </section>

    <form class="login-card" [formGroup]="loginForm" (ngSubmit)="entrar()">
      <label>
        E-mail
        <input type="email" formControlName="email" placeholder="seuemail@exemplo.com" />
      </label>

      <label>
        Senha
        <input type="password" formControlName="senha" placeholder="Digite sua senha" />
      </label>

      <p class="feedback-message" *ngIf="mensagem">{{ mensagem }}</p>

      <button class="primary-action" type="submit" [disabled]="carregando">
        {{ carregando ? 'Entrando...' : 'Entrar' }}
      </button>
      <a class="secondary-action" routerLink="/cadastro">Criar conta</a>
    </form>

    <section class="barista-tip">
      <img src="/barista-cafe.png" alt="" />
      <div>
        <strong>Dica do Barista</strong>
        <p>Organize entradas, sa&iacute;das e metas com a calma de um bom caf&eacute;.</p>
      </div>
    </section>
  </section>
</main>
